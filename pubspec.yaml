name: movie_shelf
description: 映画棚 - 自分のスマホ内の映画・ドラマファイルを並べる棚アプリ
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

# Androidのビルドエラー対策: lifecycleプラグインを古い版に固定(compileSdk 34で動く版)
# 新しい版は compileSdk 36 を要求し、file_picker(34) とぶつかって
# :file_picker:checkDebugAarMetadata で落ちるため。sturdy-spoon と同じ対策。
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true
